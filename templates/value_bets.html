{% extends 'base.html' %}
{% block content %}
<h2 style="margin-bottom:16px;">💰 Value Bets</h2>

{% if not bets %}
  <div class="empty-state">Hakuna value bets kwa sasa.</div>
{% endif %}

{% for b in bets %}
<div class="value-row">
  <div>
    <div style="font-weight:700; font-size:14px;">{{ b.home }} vs {{ b.away }}</div>
    <div style="font-size:12px; color:var(--text-dim); margin-top:2px;">{{ b.date }} · {{ b.market }}</div>
    <div style="margin-top:6px;">
      <span class="tier-badge {{ b.tier.class }}">{{ b.tier.icon }} {{ b.probability }}%</span>
      <span style="font-size:12px; color:var(--text-dim); margin-left:6px;">@ {{ b.odds }}</span>
    </div>
  </div>
  <div class="ev-badge">+{{ b.ev }}%</div>
</div>
{% endfor %}
{% endblock %}
