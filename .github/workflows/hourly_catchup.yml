# .github/workflows/hourly_catchup.yml
#
# JOB A — Kila saa: inavuta mechi zilizokwisha, inasasisha dataset ya
# Kaggle, inasettle PENDING zote, na kuandika matokeo halisi kwa History.

name: Hourly Catchup

on:
  schedule:
    - cron: '15 * * * *'   # Dakika 15 baada ya kila saa (UTC)
  workflow_dispatch:

concurrency:
  group: hourly-catchup
  cancel-in-progress: false

jobs:
  catchup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install kaggle requests
          pip install -r requirements.txt

      - name: Configure Kaggle credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"$KAGGLE_USERNAME\",\"key\":\"$KAGGLE_KEY\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Fetch recent results, update dataset, settle PENDING
        env:
          ALLSPORTSAPI_KEY: ${{ secrets.ALLSPORTSAPI_KEY }}
          KAGGLE_DATASET_SLUG: tonticha/historical-complete-no-gap
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_URL: ${{ secrets.APP_URL }}
          REFRESH_SECRET: ${{ secrets.REFRESH_SECRET }}
        run: python .github/scripts/hourly_catchup.py

      - name: Sync match results to database (for History)
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python .github/scripts/sync_match_results.py
