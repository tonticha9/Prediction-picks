# .github/workflows/hourly_catchup.yml
#
# JOB A — Kila dakika 30: inavuta mechi zilizokwisha, inasasisha dataset ya
# Kaggle, inasettle PENDING zote, inaandika matokeo halisi kwa History,
# na inasasisha saa za kuanza kwa mechi (EAT).
# v7: kila dakika 30, diagnostic steps zimeondolewa, sync ya saa za mechi.

name: Hourly Catchup

on:
  schedule:
    - cron: '5,35 * * * *'   # dakika 5 na 35 za kila saa (UTC)
  workflow_dispatch:

concurrency:
  group: hourly-catchup
  cancel-in-progress: false

jobs:
  catchup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install kaggle requests
          pip install -r requirements.txt

      - name: Configure Kaggle credentials
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "❌ Secret KAGGLE_API_TOKEN haipo au ni tupu"
            exit 1
          fi
          mkdir -p ~/.kaggle
          printf '%s' "$KAGGLE_API_TOKEN" > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token
          echo "✅ Tokeni ya Kaggle imehifadhiwa"

      - name: Fetch recent results, update dataset, settle PENDING
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          ALLSPORTSAPI_KEY: ${{ secrets.ALLSPORTSAPI_KEY }}
          KAGGLE_DATASET_SLUG: tonticha/historical-complete-no-gap
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_URL: ${{ secrets.APP_URL }}
          REFRESH_SECRET: ${{ secrets.REFRESH_SECRET }}
        run: python .github/scripts/hourly_catchup.py

      - name: Sync match results to database (for History)
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python .github/scripts/sync_match_results.py

      - name: Sync fixture kickoff times (EAT)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALLSPORTSAPI_KEY: ${{ secrets.ALLSPORTSAPI_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          REFRESH_SECRET: ${{ secrets.REFRESH_SECRET }}
          FORCE_TIMES: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python .github/scripts/sync_fixture_times.py