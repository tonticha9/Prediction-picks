# .github/workflows/nightly_predictions.yml
#
# JOB B — Inaendesha kila usiku, inatrigger Kaggle notebook, inapakua
# predictions.csv/value_bets.csv/combos.csv, inaziweka kwenye data/
# folder ya repo (Render itaziona na ku-deploy yenyewe), KISHA inaita
# /api/refresh ya app moja kwa moja ili data ionekane papo hapo bila
# kusubiri Render redeploy.
#
# v2 (Oct 15 2026): kikomo cha job kimeongezwa hadi dakika 170, na 'concurrency' inazuia nightly mbili pamoja.
# v3 (Oct 18 2026): kivuli cha v8 - archive_shadow.py (hiari kabisa).
# v4 (Oct 25 2026): push inavuta mabadiliko mapya ya 'main' kwanza (git pull --rebase) na kujaribu tena hadi mara 5.
# v5 (Oct 27 2026): calibration ya kila siku (daily_calibration.py), continue-on-error.
# v6 (Nov 1 2026): 'six' imeongezwa kwenye pip install.
# v7 (Nov 7 2026): (1) calibration inaendeshwa kupitia calib_epoch.py (inapuuza rekodi za zamani za masoko yaliyobadilishwa injini);
#                  (2) release_monitor.py: ufuatiliaji wa matokeo halisi + rollback ya kiotomatiki (inaita retrain_weekly mode=rollback);
#                  (3) inaripoti hali kwa /api/ops/report (chanzo 'nightly_predictions').

name: Nightly Predictions Update

on:
  schedule:
    # 22:00 UTC = 01:00 usiku (saa 7 usiku) Afrika Mashariki (EAT = UTC+3)
    - cron: '0 22 * * *'
  workflow_dispatch:        # Inaruhusu ku-trigger kwa mkono

permissions:
  contents: write
  actions: write            # kwa rollback ya kiotomatiki (gh workflow run)

concurrency:
  group: nightly-predictions
  cancel-in-progress: false  # Run ya pili inasubiri ya kwanza imalize (haifutwi)

jobs:
  update-predictions:
    runs-on: ubuntu-latest
    timeout-minutes: 170    # Usalama - Kaggle inasubiriwa hadi dakika 150

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Kaggle CLI
        run: pip install kaggle pandas six

      - name: Configure Kaggle credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"$KAGGLE_USERNAME\",\"key\":\"$KAGGLE_KEY\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Trigger Kaggle notebook run + poll + download
        env:
          KAGGLE_SLUG: tonticha/final-notebook-and-dataset
        run: python .github/scripts/run_kaggle_and_fetch.py

      - name: Move downloaded files into data/
        if: env.SKIP_UPDATE != 'true'
        run: |
          mkdir -p data
          # predictions.csv ni LAZIMA - ikikosekana, workflow ishindwe
          if [ ! -s kaggle_output/predictions.csv ]; then
            echo "::error::predictions.csv haipo au ni tupu - siwezi kuendelea."
            exit 1
          fi
          cp kaggle_output/predictions.csv data/predictions.csv

          # value_bets.csv na combos.csv zinaweza kukosekana siku isiyo na picks
          for f in value_bets combos; do
            if [ -s "kaggle_output/$f.csv" ]; then
              cp "kaggle_output/$f.csv" "data/$f.csv"
            else
              echo "::warning::$f.csv haipo kwenye output ya Kaggle (huenda hakuna picks leo). Naweka header tu."
              if [ -f "data/$f.csv" ]; then
                head -n 1 "data/$f.csv" > "data/$f.tmp"
                mv "data/$f.tmp" "data/$f.csv"
              else
                echo "::error::data/$f.csv haipo na hakuna header ya kutumia. Run ya kwanza lazima itoe $f.csv."
                exit 1
              fi
            fi
          done

          # Kivuli cha v8 (HIARI - haivunji chochote ikishindwa)
          python .github/scripts/archive_shadow.py || echo "::warning::archive_shadow imeshindwa (haiathiri app)."

      # v5: maktaba za app (ili scripts zifikie database kama hourly_catchup inavyofanya)
      - name: Install app requirements (for calibration + monitor)
        if: env.SKIP_UPDATE != 'true'
        continue-on-error: true
        run: pip install -r requirements.txt

      # v7: calibration ya kila siku kupitia calib_epoch.py (daily_calibration + kupuuza rekodi za zamani za masoko yaliyobadilishwa).
      # Ikishindwa, faili zinabaki za Kaggle (nightly inaendelea). Kwa jaribio bila kubadilisha faili: CALIB_MODE: shadow
      - name: Daily calibration (never blocks nightly)
        if: env.SKIP_UPDATE != 'true'
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CALIB_MODE: apply
        run: python .github/scripts/calib_epoch.py

      # v7: ufuatiliaji wa matokeo halisi. Inaripoti kwa /admin/ops na inaweza kuomba rollback (action=rollback).
      # ROLLBACK_ENABLED: 'no' = inaripoti tu, haichukui hatua.
      - name: Release monitor (real results)
        id: relmon
        if: env.SKIP_UPDATE != 'true'
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_URL: ${{ secrets.APP_URL }}
          REFRESH_SECRET: ${{ secrets.REFRESH_SECRET }}
          ROLLBACK_ENABLED: 'yes'
        run: python .github/scripts/release_monitor.py

      - name: Commit and push updated data
        if: env.SKIP_UPDATE != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/predictions.csv data/value_bets.csv data/combos.csv
          # Faili za kivuli (zikiwepo tu)
          if [ -f data/predictions_v8.csv ]; then git add data/predictions_v8.csv || true; fi
          if [ -d shadow ]; then git add shadow || true; fi
          git diff --staged --quiet || git commit -m "Auto-update predictions $(date -u +'%Y-%m-%d %H:%M UTC')"

          # Vuta mabadiliko mapya ya main kisha sukuma; jaribu tena hadi mara 5
          pushed=0
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push; then
              pushed=1
              break
            fi
            echo "Push jaribio $i limeshindwa, najaribu tena..."
            git rebase --abort 2>/dev/null || true
            sleep $((i*5))
          done
          if [ "$pushed" != "1" ]; then
            echo "::error::Push imeshindwa baada ya majaribio 5."
            exit 1
          fi
          echo "✅ Push imefanikiwa."

      - name: Trigger app refresh (/api/refresh)
        if: env.SKIP_UPDATE != 'true'
        env:
          APP_URL: ${{ secrets.APP_URL }}
          REFRESH_SECRET: ${{ secrets.REFRESH_SECRET }}
        run: |
          echo "Kusubiri sekunde 20 Render ipate muda ikiwa bado inadeploy..."
          sleep 20
          for attempt in 1 2 3; do
            status=$(curl -s -o /tmp/refresh_out.json -w "%{http_code}" -X POST "$APP_URL/api/refresh" \
              -H "X-Refresh-Secret: $REFRESH_SECRET")
            echo "Jaribio $attempt - HTTP $status"
            cat /tmp/refresh_out.json
            echo ""
            if [ "$status" = "200" ]; then
              echo "✅ App imesasishwa (refresh imefanikiwa)."
              exit 0
            fi
            sleep 30
          done
          echo "::warning::App refresh haikufanikiwa baada ya majaribio 3 - data mpya ipo kwenye repo, lakini app inaweza bado kuonyesha cache ya zamani hadi redeploy ijayo."

      # v7: rollback ya kiotomatiki - inaendeshwa TU kama release_monitor imesema action=rollback
      - name: Auto rollback (only if monitor says so)
        if: steps.relmon.outputs.action == 'rollback'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "🛑 Matokeo halisi yameshuka baada ya release: naomba rollback ya run ${{ steps.relmon.outputs.rollback_run_id }}"
          gh workflow run retrain_weekly.yml --ref main -f mode=rollback -f publish=yes -f rollback_run_id=${{ steps.relmon.outputs.rollback_run_id }}

      - name: Skipped (no new matches)
        if: env.SKIP_UPDATE == 'true'
        run: echo "ℹ️ Hakuna mechi mpya zilizopatikana (huenda ni international break) - data ya app haijabadilishwa, predictions za zamani zinaendelea kutumika."

      # v7: ripoti hali kwa app (/admin/ops). Mafanikio yanaponya bango jekundu lenyewe.
      - name: Report to ops monitor
        if: always()
        continue-on-error: true
        env:
          APP_URL: ${{ secrets.APP_URL }}
          REFRESH_SECRET: ${{ secrets.REFRESH_SECRET }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$APP_URL" ]; then exit 0; fi
          code=$(curl -s -m 25 -o /dev/null -w "%{http_code}" -X POST "$APP_URL/api/ops/report" \
            -H "X-Refresh-Secret: $REFRESH_SECRET" -H "Content-Type: application/json" \
            -d "{\"source\":\"nightly_predictions\",\"status\":\"$JOB_STATUS\",\"detail\":\"nightly\",\"url\":\"$RUN_URL\"}")
          echo "ops report: HTTP $code"