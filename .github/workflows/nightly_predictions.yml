# .github/workflows/nightly_predictions.yml
#
# JOB B — Inaendesha kila usiku, inatrigger Kaggle notebook, inapakua
# predictions.csv/value_bets.csv/combos.csv, inaziweka kwenye data/
# folder ya repo (Render itaziona na ku-deploy yenyewe), KISHA inaita
# /api/refresh ya app moja kwa moja ili data ionekane papo hapo bila
# kusubiri Render redeploy.

name: Nightly Predictions Update

on:
  schedule:
    - cron: '0 2 * * *'   # Kila siku saa 2 usiku (UTC) - badilisha kama unataka saa tofauti
  workflow_dispatch:        # Inaruhusu ku-trigger kwa mkono (kwa jaribio la kwanza)

jobs:
  update-predictions:
    runs-on: ubuntu-latest
    timeout-minutes: 90     # Usalama - isiendelee milele ikiwa kitu kikakwama

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Kaggle CLI
        run: pip install kaggle pandas

      - name: Configure Kaggle credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"$KAGGLE_USERNAME\",\"key\":\"$KAGGLE_KEY\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Trigger Kaggle notebook run + poll + download
        env:
          KAGGLE_SLUG: tonticha/final-notebook-and-dataset
        run: python .github/scripts/run_kaggle_and_fetch.py

      - name: Move downloaded files into data/
        if: env.SKIP_UPDATE != 'true'
        run: |
          mkdir -p data
          cp kaggle_output/predictions.csv data/predictions.csv
          cp kaggle_output/value_bets.csv data/value_bets.csv
          cp kaggle_output/combos.csv data/combos.csv

      - name: Commit and push updated data
        if: env.SKIP_UPDATE != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/predictions.csv data/value_bets.csv data/combos.csv
          git diff --staged --quiet || git commit -m "Auto-update predictions $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Trigger app refresh (/api/refresh)
        if: env.SKIP_UPDATE != 'true'
        env:
          APP_URL: ${{ secrets.APP_URL }}
          REFRESH_SECRET: ${{ secrets.REFRESH_SECRET }}
        run: |
          echo "Kusubiri sekunde 20 Render ipate muda ikiwa bado inadeploy..."
          sleep 20
          for attempt in 1 2 3; do
            status=$(curl -s -o /tmp/refresh_out.json -w "%{http_code}" -X POST "$APP_URL/api/refresh" \
              -H "X-Refresh-Secret: $REFRESH_SECRET")
            echo "Jaribio $attempt - HTTP $status"
            cat /tmp/refresh_out.json
            echo ""
            if [ "$status" = "200" ]; then
              echo "✅ App imesasishwa (refresh imefanikiwa)."
              exit 0
            fi
            sleep 30
          done
          echo "::warning::App refresh haikufanikiwa baada ya majaribio 3 - data mpya ipo kwenye repo, lakini app inaweza bado kuonyesha cache ya zamani hadi redeploy ijayo."

      - name: Skipped (no new matches)
        if: env.SKIP_UPDATE == 'true'
        run: echo "ℹ️ Hakuna mechi mpya zilizopatikana (huenda ni international break) - data ya app haijabadilishwa, predictions za zamani zinaendelea kutumika."
