# .github/workflows/v8_compare.yml
# V1: kupima V8 dhidi ya v6 kwa kila soko (mechi zilizokwisha). Matokeo: tab ya "Summary" ya run
# na faili data/v8_vs_v6.csv + data/v8_vs_v6_summary.json kwenye repo.
# Inaendeshwa kila siku saa 06:30 UTC (baada ya nightly) au kwa mkono (Run workflow).

name: V8 vs v6 Compare

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v8-compare
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install libraries
        run: pip install pandas numpy sqlalchemy psycopg2-binary

      - name: Compare V8 vs v6
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python .github/scripts/v8_compare.py

      - name: Commit report
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/v8_vs_v6.csv data/v8_vs_v6_summary.json
          git diff --staged --quiet || git commit -m "V8 vs v6 report $(date -u +'%Y-%m-%d %H:%M UTC')"
          pushed=0
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push; then
              pushed=1
              break
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i*5))
          done
          if [ "$pushed" != "1" ]; then
            echo "::warning::Push ya ripoti imeshindwa (ripoti ipo kwenye Summary ya run)."
          fi