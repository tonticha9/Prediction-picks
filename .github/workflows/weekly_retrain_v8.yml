name: Weekly Retrain v8

on:
  schedule:
    - cron: '0 4 * * 1'      # Jumatatu 04:00 UTC = 07:00 EAT
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Chapisha hata gate ikikataa (1 = ndio)'
        default: '0'

permissions:
  contents: write

concurrency:
  group: weekly-retrain-v8
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Kaggle CLI
        run: pip install kaggle

      - name: Retrain + gate + chapisha
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          FORCE_PUBLISH: ${{ github.event.inputs.force_publish || '0' }}
        run: python .github/scripts/retrain_v8_run.py

      - name: Hifadhi log ya retrain
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add shadow/retrain_log.csv || true
          if git diff --cached --quiet; then
            echo "hakuna mabadiliko"
          else
            git commit -m "retrain log [skip ci] [skip render]"
            git pull --rebase || true
            git push
          fi