# .github/workflows/quality_weekly.yml
# Kila Jumapili: inahesabu upya base rate halisi za masoko (miezi 12) kwa app.
# Hakuna Kaggle notebook: inasoma dataset ya historia tu.

name: Quality Weekly

on:
  schedule:
    - cron: '30 5 * * 0'     # Jumapili 05:30 UTC
  workflow_dispatch:

concurrency:
  group: quality-weekly
  cancel-in-progress: false

jobs:
  base-rates:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install kaggle requests six
          pip install -r requirements.txt

      - name: Configure Kaggle credentials
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "❌ Secret KAGGLE_API_TOKEN haipo au ni tupu"
            exit 1
          fi
          mkdir -p ~/.kaggle
          printf '%s' "$KAGGLE_API_TOKEN" > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token

      - name: Update base rates
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_DATASET_SLUG: tonticha/historical-complete-no-gap
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_URL: ${{ secrets.APP_URL }}
          REFRESH_SECRET: ${{ secrets.REFRESH_SECRET }}
        run: python .github/scripts/update_base_rates.py